<!doctype html>
<html lang="bn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#190e24"><title>TruthLayer BD</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 15%,#37204f,#190e24 65%);color:#f6edf9;font:18px/1.6 system-ui,"Noto Sans Bengali",sans-serif}main{max-width:440px;margin:20px;padding:32px;background:#25172f;border:1px solid #68407f;border-radius:18px}h1{font-size:1.6rem}button{min-height:48px;padding:10px 20px;border:1px solid #bb8fdb;border-radius:10px;background:#643b82;color:white;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #f6edf9;outline-offset:3px}</style></head>
<body><main><h1 id="title">ইন্টারনেট সংযোগ নেই</h1><p id="message">নতুন ছবি বা দাবি যাচাই করতে ইন্টারনেট প্রয়োজন। সংযোগ ফিরে এলে আবার চেষ্টা করুন।</p><button id="retry" onclick="location.reload()">আবার চেষ্টা করুন</button></main>
<script>try{if(localStorage.getItem('truthlayer-language')==='en'){document.documentElement.lang='en';document.getElementById('title').textContent='You are offline';document.getElementById('message').textContent='An internet connection is needed to upload or analyze an image. Reconnect and try again.';document.getElementById('retry').textContent='Try again'}}catch{}</script></body>
</html>
